global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bookly'
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ['web:8000']  # internal service name and port; update if APP_PORT changes
        labels:
          service: 'bookly'
          env: 'dev'
