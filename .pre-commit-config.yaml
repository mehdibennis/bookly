repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check .
        language: system
        types: [python]
      - id: black
        name: black
        entry: black .
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy --config-file=mypy.ini
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
