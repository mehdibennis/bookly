name: CI

on: [push, pull_request]

# Grant the workflow explicit permissions needed to post PR comments.
# Note: this won't allow writing comments for workflows triggered from forks
# (see README notes below). If you need comments for fork PRs, use
# `pull_request_target` or a bot token with caution.
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Ensure Settings() can be constructed in CI and code that composes
      # DATABASE_URL / SYNC_DATABASE_URL will find working values.
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookly_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bookly_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bookly_test
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres
        # Use a small Python port-check loop to avoid depending on pg_isready
        # being available on the runner. This waits up to ~30s for DB port.
        run: |
          python - <<'PY'
          import socket, time, sys
          host = '127.0.0.1'
          port = 5432
          for _ in range(30):
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print('Postgres port open')
                      sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('Timed out waiting for Postgres')
          sys.exit(1)
          PY
      - name: Run tests
        env:
          # Also export DB connection details to the test step explicitly
          POSTGRES_HOST: ${{ env.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ env.POSTGRES_PORT }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYNC_DATABASE_URL: ${{ env.SYNC_DATABASE_URL }}
        run: |
          # Ensure pytest can construct Settings() (tests expect DB env vars)
          pytest --maxfail=1 -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Type check
        run: |
          PYTHONPATH=./app mypy app --ignore-missing-imports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const xmlPath = 'coverage.xml';
            let pct = 'N/A';
            if (fs.existsSync(xmlPath)) {
              const xml = fs.readFileSync(xmlPath, 'utf8');
              const m = xml.match(/line-rate="([0-9.]+)"/);
              if (m) pct = (parseFloat(m[1]) * 100).toFixed(2) + '%';
            }
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request && context.payload.pull_request.number;
            if (!pr) {
              core.info('No pull request found; skipping coverage comment.');
              return;
            }

            // Marker to identify the bot's comment so we update instead of creating duplicates
            const MARKER = '<!-- codecov-summary -->';
            const body = `${MARKER}\nCodecov summary for this PR: **${pct}**\n\n![Codecov sunburst](https://codecov.io/github/${owner}/${repo}/graphs/sunburst.svg)\n\nFull report: https://codecov.io/gh/${owner}/${repo}`;

            // List existing comments on the PR and find one with our marker.
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = comments.data.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
