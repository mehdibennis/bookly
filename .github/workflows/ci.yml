name: CI

on: [push, pull_request]

permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookly_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bookly_test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bookly_test
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          # Export DB connection details to the test step explicitly
          POSTGRES_HOST: ${{ env.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ env.POSTGRES_PORT }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYNC_DATABASE_URL: ${{ env.SYNC_DATABASE_URL }}
        run: |
          # Ensure pytest can construct Settings() (tests expect DB env vars)
          pytest --maxfail=1 -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Type check
        run: |
          PYTHONPATH=./app mypy app --ignore-missing-imports

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
